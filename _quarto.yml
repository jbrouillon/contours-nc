project:
  type: website
  output-dir: docs
  resources:
    - .nojekyll
  render:
    - "*.qmd"
    - "articles/*.qmd"
    - "dataviz/*.qmd"
    - "posts/*/index.qmd"
    - "ressources/*.qmd"

website:
  title: "Contours"
  description: "Sciences sociales, cartographie et dataviz en Nouvelle-Calédonie"
  site-url: "https://jbrouillon.github.io/contours-nc/"
  favicon: images/logo.png
  navbar:
    logo: images/logo.png
    title: "Contours"
    left:
      - text: "Articles"
        href: articles/index.qmd
      - text: "Dataviz"
        href: dataviz/index.qmd
      - text: "Ressources"
        href: ressources/index.qmd
      - text: "À propos"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/jbrouillon/contours-nc
  page-footer:
    left: "© Jonas Brouillon"
    right: "Fait avec Quarto"
  search: true

format:
  html:
    theme:
      light: cosmo
    css: styles.css
    include-in-header:
      - text: |
          <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    include-after-body:
      - text: |
          <div class="image-lightbox" id="image-lightbox" aria-hidden="true">
            <button class="image-lightbox__close" type="button" aria-label="Fermer l’image agrandie">×</button>
            <figure class="image-lightbox__figure">
              <img class="image-lightbox__img" alt="">
              <figcaption class="image-lightbox__caption"></figcaption>
            </figure>
          </div>
          <script>
          (() => {
            const lightbox = document.getElementById("image-lightbox");
            if (!lightbox) return;

            const lightboxImg = lightbox.querySelector(".image-lightbox__img");
            const caption = lightbox.querySelector(".image-lightbox__caption");
            const closeButton = lightbox.querySelector(".image-lightbox__close");

            const getCaption = (img) => {
              const figureCaption = img.closest("figure")?.querySelector("figcaption");
              return (figureCaption?.innerText || img.alt || "").trim();
            };

            const isEligible = (img) => {
              if (img.closest("a, nav, footer, .navbar, .page-footer")) return false;
              if (img.closest(".no-lightbox") || img.classList.contains("no-lightbox")) return false;
              return true;
            };

            const openLightbox = (img) => {
              lightboxImg.src = img.currentSrc || img.src;
              lightboxImg.alt = img.alt || "";
              const text = getCaption(img);
              caption.textContent = text;
              caption.hidden = !text;
              lightbox.classList.add("is-open");
              lightbox.setAttribute("aria-hidden", "false");
              document.body.classList.add("lightbox-open");
              closeButton.focus();
            };

            const closeLightbox = () => {
              lightbox.classList.remove("is-open");
              lightbox.setAttribute("aria-hidden", "true");
              document.body.classList.remove("lightbox-open");
              lightboxImg.removeAttribute("src");
            };

            document.querySelectorAll("main img, #quarto-content img").forEach((img) => {
              if (!isEligible(img)) return;
              img.classList.add("quarto-lightbox-enabled");
              img.setAttribute("tabindex", "0");
              img.setAttribute("role", "button");
              img.setAttribute("aria-label", "Agrandir l’image");
              img.addEventListener("click", () => openLightbox(img));
              img.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                  event.preventDefault();
                  openLightbox(img);
                }
              });
            });

            closeButton.addEventListener("click", closeLightbox);
            lightbox.addEventListener("click", (event) => {
              if (event.target === lightbox) closeLightbox();
            });
            document.addEventListener("keydown", (event) => {
              if (event.key === "Escape" && lightbox.classList.contains("is-open")) {
                closeLightbox();
              }
            });
          })();
          </script>
    toc: true
    number-sections: false
    fig-cap-location: bottom
    tbl-cap-location: top
    lof: true
    lot: true
    code-fold: true
    code-summary: "Afficher le code"
    fig-width: 8
    fig-height: 5
    lang: fr

execute:
  freeze: auto
  warning: false
  message: false

editor: visual
