<script>
(() => {
  const citationSection = document.querySelector("#quarto-citation");
  if (!citationSection || citationSection.dataset.contoursCitation === "true") return;

  const decodeEntities = (value) => {
    let decoded = value || "";
    const textarea = document.createElement("textarea");
    for (let i = 0; i < 3; i += 1) {
      textarea.innerHTML = decoded;
      const next = textarea.value;
      if (next === decoded) break;
      decoded = next;
    }
    return decoded;
  };
  const clean = (value) => decodeEntities(value).replace(/\s+/g, " ").trim();
  const meta = (name) => clean(document.querySelector(`meta[name="${name}"]`)?.content || "");
  const metas = (name) => Array.from(document.querySelectorAll(`meta[name="${name}"]`))
    .map((item) => clean(item.content))
    .filter(Boolean);

  const nativeBibtex = citationSection
    .querySelector(".quarto-appendix-bibtex code")
    ?.textContent
    ?.trim() || "";

  const title = meta("citation_title")
    || clean(document.querySelector("h1.title")?.textContent)
    || clean(document.title.replace(/\s*[–—|-]\s*Contours\s*$/i, ""));

  const fallbackAuthor = clean(
    document.querySelector(".quarto-title-meta > div:first-child .quarto-title-meta-contents")?.textContent
  );
  const authors = metas("citation_author");
  if (!authors.length && fallbackAuthor) authors.push(fallbackAuthor);

  const canonical = document.querySelector('link[rel="canonical"]')?.href || window.location.href;
  const url = meta("citation_fulltext_html_url") || new URL(canonical, window.location.href).href;
  const language = meta("citation_language") || document.documentElement.lang || "fr";
  const rawDate = meta("citation_publication_date")
    || meta("citation_online_date")
    || document.querySelector("time")?.getAttribute("datetime")
    || "";

  const parseDate = (value) => {
    const match = value.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (!match) return null;
    return {
      year: match[1],
      month: match[2].padStart(2, "0"),
      day: match[3].padStart(2, "0"),
      value: new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]))
    };
  };

  const date = parseDate(rawDate);
  const year = date?.year || new Date().getFullYear().toString();
  const dateLong = date
    ? new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" }).format(date.value)
    : year;
  const dateApa = date
    ? new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long" }).format(date.value)
    : "";
  const accessDate = new Intl.DateTimeFormat("fr-FR", {
    day: "numeric",
    month: "long",
    year: "numeric"
  }).format(new Date());

  const splitName = (fullName) => {
    const parts = clean(fullName).split(" ").filter(Boolean);
    if (parts.length < 2) return { given: "", family: parts[0] || "" };
    return { given: parts.slice(0, -1).join(" "), family: parts.at(-1) };
  };

  const names = authors.map(splitName);
  const joinNames = (items, lastJoin = " et ") => {
    if (items.length < 2) return items[0] || "";
    if (items.length === 2) return items.join(lastJoin);
    return `${items.slice(0, -1).join(", ")}${lastJoin}${items.at(-1)}`;
  };

  const initials = (given) => given
    .split(/[\s-]+/)
    .filter(Boolean)
    .map((part) => `${part.charAt(0).toLocaleUpperCase("fr-FR")}.`)
    .join(" ");

  const apaAuthors = joinNames(
    names.map(({ given, family }) => `${family}, ${initials(given)}`.trim()),
    " & "
  );
  const chicagoAuthors = joinNames(
    names.map(({ given, family }, index) => index === 0
      ? `${family}, ${given}`.trim().replace(/,$/, "")
      : `${given} ${family}`.trim())
  );
  const isoAuthors = names
    .map(({ given, family }) => `${family.toLocaleUpperCase("fr-FR")}, ${given}`.trim().replace(/,$/, ""))
    .join(" ; ");

  const risAuthors = names
    .map(({ given, family }) => `AU  - ${family}, ${given}`.trimEnd())
    .join("\n");
  const risDate = date ? `${date.year}/${date.month}/${date.day}` : year;
  const ris = [
    "TY  - ELEC",
    risAuthors,
    `TI  - ${title}`,
    "T2  - Contours",
    `PY  - ${year}`,
    `DA  - ${risDate}`,
    `UR  - ${url}`,
    `LA  - ${language}`,
    "ER  -"
  ].filter(Boolean).join("\n");

  const fallbackBibtex = `@online{contours${year},
  author = {${authors.join(" and ")}},
  title = {${title}},
  date = {${date ? `${date.year}-${date.month}-${date.day}` : year}},
  url = {${url}},
  langid = {${language}}
}`;

  const formats = {
    apa: {
      label: "APA 7",
      value: `${apaAuthors} (${year}${dateApa ? `, ${dateApa}` : ""}). ${title}. Contours. ${url}`
    },
    chicago: {
      label: "Chicago",
      value: `${chicagoAuthors}. « ${title} ». Contours, ${dateLong}. ${url}.`
    },
    iso: {
      label: "ISO 690",
      value: `${isoAuthors}. ${title} [en ligne]. Contours, ${dateLong} [consulté le ${accessDate}]. Disponible à l’adresse : ${url}.`
    },
    bibtex: {
      label: "BibTeX",
      extension: "bib",
      value: nativeBibtex || fallbackBibtex
    },
    ris: {
      label: "RIS",
      extension: "ris",
      value: ris
    }
  };

  const appendix = citationSection.closest("#quarto-appendix");
  appendix?.classList.add("article-citation-appendix");
  citationSection.dataset.contoursCitation = "true";
  citationSection.className = "article-citation";
  citationSection.innerHTML = `
    <button class="article-citation__trigger" type="button"
      aria-expanded="false" aria-controls="article-citation-panel"
      data-testid="article-citation-trigger">
      <span class="article-citation__trigger-icon" aria-hidden="true"><i class="bi bi-quote"></i></span>
      <span class="article-citation__trigger-label">Comment citer cet article&nbsp;?</span>
      <i class="bi bi-chevron-down article-citation__chevron" aria-hidden="true"></i>
    </button>
    <div class="article-citation__panel" id="article-citation-panel" hidden>
      <div class="article-citation__intro">
        <div>
          <h2 class="article-citation__title">Citer cet article</h2>
          <p>Choisissez le format qui convient à votre usage.</p>
        </div>
      </div>
      <div class="article-citation__formats" role="group" aria-label="Format de citation"></div>
      <div class="article-citation__output" aria-live="polite">
        <pre><code></code></pre>
      </div>
      <div class="article-citation__actions">
        <button class="article-citation__copy" type="button">
          <i class="bi bi-copy" aria-hidden="true"></i>
          <span>Copier la citation</span>
        </button>
        <button class="article-citation__download" type="button" hidden>
          <i class="bi bi-download" aria-hidden="true"></i>
          <span>Télécharger</span>
        </button>
        <span class="article-citation__status" role="status" aria-live="polite"></span>
      </div>
    </div>`;

  const trigger = citationSection.querySelector(".article-citation__trigger");
  const panel = citationSection.querySelector(".article-citation__panel");
  const formatList = citationSection.querySelector(".article-citation__formats");
  const output = citationSection.querySelector(".article-citation__output code");
  const copyButton = citationSection.querySelector(".article-citation__copy");
  const downloadButton = citationSection.querySelector(".article-citation__download");
  const downloadLabel = downloadButton.querySelector("span");
  const status = citationSection.querySelector(".article-citation__status");
  let activeFormat = "apa";
  let statusTimer;

  const setStatus = (message) => {
    window.clearTimeout(statusTimer);
    status.textContent = message;
    statusTimer = window.setTimeout(() => { status.textContent = ""; }, 2400);
  };

  const renderFormat = (format) => {
    activeFormat = format;
    output.textContent = formats[format].value;
    formatList.querySelectorAll("button").forEach((button) => {
      const selected = button.dataset.format === format;
      button.classList.toggle("is-active", selected);
      button.setAttribute("aria-pressed", selected.toString());
    });

    const extension = formats[format].extension;
    downloadButton.hidden = !extension;
    if (extension) downloadLabel.textContent = `Télécharger .${extension}`;
  };

  Object.entries(formats).forEach(([key, format]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "article-citation__format";
    button.dataset.format = key;
    button.setAttribute("aria-pressed", "false");
    button.textContent = format.label;
    button.addEventListener("click", () => renderFormat(key));
    formatList.appendChild(button);
  });

  trigger.addEventListener("click", () => {
    const open = trigger.getAttribute("aria-expanded") === "true";
    trigger.setAttribute("aria-expanded", (!open).toString());
    panel.hidden = open;
  });

  const copyToClipboard = async (text) => {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.top = "-1000px";
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    textarea.remove();
  };

  copyButton.addEventListener("click", async () => {
    try {
      await copyToClipboard(formats[activeFormat].value);
      setStatus("Citation copiée");
    } catch (error) {
      setStatus("Copie impossible");
    }
  });

  downloadButton.addEventListener("click", () => {
    const format = formats[activeFormat];
    if (!format.extension) return;
    const slug = window.location.pathname.split("/").filter(Boolean).at(-1) || "article-contours";
    const blob = new Blob([format.value], { type: "text/plain;charset=utf-8" });
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = objectUrl;
    link.download = `${slug}.${format.extension}`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(objectUrl);
    setStatus(`Fichier .${format.extension} préparé`);
  });

  renderFormat(activeFormat);
})();
</script>
