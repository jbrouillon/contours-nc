<script>
(() => {
  const normalizePath = (value) => {
    const path = value.replace(/\/index\.html$/, "/");
    return path.endsWith("/") ? path : `${path}/`;
  };

  const currentPath = normalizePath(window.location.pathname);
  if (!/\/posts\/[^/]+\/$/.test(currentPath)) return;

  const main = document.querySelector("main.content");
  if (!main || main.querySelector("#cusdis_thread")) return;

  const meta = (name) => document.querySelector(`meta[name="${name}"]`)?.content?.trim() || "";
  const canonical = meta("citation_fulltext_html_url")
    || document.querySelector('link[rel="canonical"]')?.href
    || window.location.href;
  const pageUrl = new URL(canonical, window.location.href);
  pageUrl.hash = "";
  pageUrl.search = "";

  const pagePath = normalizePath(pageUrl.pathname);
  const pageTitle = meta("citation_title")
    || document.querySelector("h1.title, h1")?.textContent?.trim()
    || document.title.replace(/\s*[-|]\s*Contours\s*$/i, "").trim();
  const reviewMode = document.body.classList.contains("review-version");

  const section = document.createElement("section");
  section.className = "article-comments";
  section.setAttribute("aria-labelledby", "article-comments-title");

  const title = document.createElement("h2");
  title.className = "article-comments__title";
  title.id = "article-comments-title";
  title.textContent = reviewMode ? "Commentaires sur cette version" : "Commentaires";

  const thread = document.createElement("div");
  thread.id = "cusdis_thread";
  thread.dataset.host = "https://cusdis.com";
  thread.dataset.appId = "fc8f899f-0955-4999-99f3-9c70d4d66c5b";
  thread.dataset.pageId = pagePath.replace(/\/$/, "") || "/";
  thread.dataset.pageUrl = pageUrl.href;
  thread.dataset.pageTitle = pageTitle;

  section.append(title, thread);

  main.appendChild(section);

  if (reviewMode) {
    const reviewLinks = document.querySelectorAll('a[href="#article-comments-title"]');
    const scrollToComments = (event) => {
      event.preventDefault();
      section.scrollIntoView({
        behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
        block: "start"
      });
    };
    reviewLinks.forEach((link) => link.addEventListener("click", scrollToComments));

    const floatingButton = document.createElement("button");
    floatingButton.type = "button";
    floatingButton.className = "review-comment-button";
    floatingButton.setAttribute("aria-label", "Ajouter un commentaire sur cette version");
    floatingButton.innerHTML = '<i class="bi bi-chat-left-text" aria-hidden="true"></i><span>Commenter</span>';
    floatingButton.addEventListener("click", scrollToComments);
    document.body.appendChild(floatingButton);
  }

  const endTargets = [main.querySelector(".article-share"), section].filter(Boolean);
  if (window.IntersectionObserver && endTargets.length) {
    const visibleTargets = new WeakMap();
    const setTocVisibility = (entries) => {
      entries.forEach((entry) => {
        visibleTargets.set(entry.target, entry.isIntersecting);
      });
      const articleEndIsVisible = endTargets.some((target) => visibleTargets.get(target));
      document.body.classList.toggle("article-end-active", articleEndIsVisible);
    };

    const observer = new IntersectionObserver(setTocVisibility, {
      rootMargin: "0px 0px -18% 0px",
      threshold: 0.01
    });

    endTargets.forEach((target) => observer.observe(target));
  }

  if (document.querySelector('script[src="https://cusdis.com/js/cusdis.es.js"]')) {
    window.CUSDIS?.renderTo?.(thread);
    return;
  }

  const script = document.createElement("script");
  script.async = true;
  script.defer = true;
  script.src = "https://cusdis.com/js/cusdis.es.js";
  document.body.appendChild(script);
})();
</script>
