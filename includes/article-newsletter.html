<script>
(() => {
  const path = window.location.pathname.replace(/\/index\.html$/, "/");
  if (!/\/posts\/[^/]+\/?$/.test(path)) return;

  const main = document.querySelector("main.content");
  if (!main || main.querySelector(".article-newsletter-cta")) return;

  const cta = document.createElement("aside");
  cta.className = "article-newsletter-cta";
  cta.innerHTML = '<span aria-hidden="true">—</span> <a href="/newsletter">Recevoir les prochaines publications →</a>';
  main.appendChild(cta);
})();
</script>
