<script>
(() => {
  const normalizePath = (value) => {
    const path = value.replace(/\/index\.html$/, "/");
    return path.endsWith("/") ? path : `${path}/`;
  };

  const path = normalizePath(window.location.pathname);
  if (!/\/newsletter\/[^/]+\/$/.test(path)) return;

  const main = document.querySelector("main.content");
  if (!main || main.querySelector(".newsletter-signup")) return;

  const section = document.createElement("section");
  section.className = "newsletter-signup";
  section.setAttribute("aria-labelledby", "newsletter-signup-title");
  section.innerHTML = `
    <h2 id="newsletter-signup-title">Recevoir les prochaines newsletters</h2>
    <form action="https://buttondown.com/api/emails/embed-subscribe/contoursnc" method="post" class="embeddable-buttondown-form newsletter-form">
      <label for="bd-email-newsletter-end">Adresse email</label>
      <div class="newsletter-form__row">
        <input type="email" name="email" id="bd-email-newsletter-end" required>
        <input type="submit" value="S'abonner">
      </div>
      <p>
        <a href="https://buttondown.com/refer/contoursnc" target="_blank" rel="noopener noreferrer">Powered by Buttondown.</a>
      </p>
      <p class="newsletter-privacy">
        Votre adresse est transmise à Buttondown et utilisée uniquement pour vous envoyer la newsletter de Contours.
        Vous pouvez vous désabonner à tout moment avec le lien présent dans chaque message.
        <a href="https://buttondown.com/legal/privacy" target="_blank" rel="noopener noreferrer">Politique de confidentialité de Buttondown</a>.
      </p>
    </form>`;

  main.appendChild(section);
})();
</script>
